name: ci-logs

# 临时诊断工作流：把 CI 上的失败输出写回仓库，便于本地排查。
# 仅在手动触发 / 推送到 ci-logs 分支时运行；README 与 .gitignore 不引用它。
#
# 为什么是单 job：两个 job 各自 force-push 同一个 ci-logs 分支会互相覆盖，
# 最终仓库里只剩一个日志文件。这里顺序跑两套测试、一次提交两份日志。
on:
  workflow_dispatch:
  push:
    branches: ["ci-logs"]

permissions:
  contents: write

concurrency:
  group: ci-logs
  cancel-in-progress: true

jobs:
  logs:
    name: capture both suites (log to repo)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install backend deps
        run: pip install -r backend/requirements.txt

      - name: install frontend deps
        run: npm ci --prefix frontend

      - name: run frontend suite
        run: |
          mkdir -p ci-logs
          ( npm test --prefix frontend ) > ci-logs/frontend.log 2>&1 || true
          tail -n 80 ci-logs/frontend.log || true

      - name: run frontend api smoke e2e
        env:
          PYTHON_BIN: python
          LLM_API_KEY: "sk-ci-dummy-not-a-real-key"
          AUTH_SECRET_KEY: "ci-test-auth-secret-key-0123456789abcdef"
          LLM_KEY_MODE: system
        run: |
          mkdir -p ci-logs
          ( npm run test:e2e --prefix frontend ) > ci-logs/frontend-e2e.log 2>&1 || true
          tail -n 80 ci-logs/frontend-e2e.log || true

      - name: run backend suite
        # 放到最后并加 timeout：若某个用例在 CI 上挂住，5 分钟后自行中断；
        # 前面的前端日志已经落盘，publish 仍会执行，backend.log 末尾就是卡住的用例名。
        run: |
          mkdir -p ci-logs
          ( cd backend && timeout --signal=INT 300 python -m unittest discover -s tests -v ) > ci-logs/backend.log 2>&1 || true
          tail -n 40 ci-logs/backend.log || true

      - name: publish logs
        run: |
          git config user.name "ci-logs-bot"
          git config user.email "ci-logs-bot@users.noreply.github.com"
          git add -f ci-logs/backend.log ci-logs/frontend.log ci-logs/frontend-e2e.log
          git commit -m "ci-logs: backend + frontend + api smoke output" || echo "no changes"
          git push origin HEAD:ci-logs --force
