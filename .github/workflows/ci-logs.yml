name: ci-logs

# 临时诊断工作流：把 CI 上的失败输出写回仓库，便于本地排查。
# 仅在手动触发 / 推送到 ci-logs 分支时运行；README 与 .gitignore 不引用它。
on:
  workflow_dispatch:
  push:
    branches: ["ci-logs"]

permissions:
  contents: write

concurrency:
  group: ci-logs
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests (log to repo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: install
        run: pip install -r requirements.txt
      - name: run tests
        working-directory: .
        run: |
          mkdir -p ci-logs
          ( cd backend && python -m unittest discover -s tests -v ) > ci-logs/backend.log 2>&1 || true
          tail -n 120 ci-logs/backend.log || true
      - name: publish log
        working-directory: .
        run: |
          git config user.name "ci-logs-bot"
          git config user.email "ci-logs-bot@users.noreply.github.com"
          git add -f ci-logs/backend.log
          git commit -m "ci-logs: backend suite output" || echo "no changes"
          git push origin HEAD:ci-logs --force

  frontend:
    name: frontend tests (log to repo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        run: npm ci
      - name: run tests
        working-directory: .
        run: |
          mkdir -p ci-logs
          ( cd frontend && npm test ) > ci-logs/frontend.log 2>&1 || true
          tail -n 120 ci-logs/frontend.log || true
      - name: publish log
        working-directory: .
        run: |
          git config user.name "ci-logs-bot"
          git config user.email "ci-logs-bot@users.noreply.github.com"
          git add -f ci-logs/frontend.log
          git commit -m "ci-logs: frontend suite output" || echo "no changes"
          git push origin HEAD:ci-logs --force
